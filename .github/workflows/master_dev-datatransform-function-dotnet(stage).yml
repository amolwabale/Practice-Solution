# Docs for the Azure Web Apps Deploy action: https://github.com/azure/functions-action
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy dotnet core app to Azure Function App - dev-datatransform-function-dotnet

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: "WebApplication/Server/.Net8/AzureFunctionApp/published"
  WORKING_DIRECTORY: "WebApplication/Server/.Net8/AzureFunctionApp"
  CONFIGURATION: Release
  DOTNET_VERSION: '8.0.x'

jobs:
  build-and-deploy:
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v4

      - name: Setup DotNet ${{ env.DOTNET_VERSION }} Environment
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 'Publish Function App'
        run: |
          dotnet publish "${{ env.WORKING_DIRECTORY }}" --configuration ${{ env.CONFIGURATION }} --output "${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}"

      - name: 'List Published Files'
        run: |
          dir "${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}" /s

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_F977BE90267C4A55880779490E0A66A9 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_484D74C569B943E4BDD81172DE84069B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D43D927BA63A40E6945DFC525387021E }}

      - name: 'Run Azure Functions Action'
        uses: Azure/functions-action@v1
        with:
          app-name: 'dev-datatransform-function-dotnet'
          slot-name: 'stage'
          package: '${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}'
